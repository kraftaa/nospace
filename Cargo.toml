[package]
name = "nospace"
version = "0.1.4"
edition = "2024"
description = "Evidence-based diagnosis for common Linux ENOSPC failures"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/kraftaa/nospace"
homepage = "https://github.com/kraftaa/nospace"
readme = "README.md"
keywords = ["linux", "filesystem", "enospc", "inotify", "diagnostics"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
