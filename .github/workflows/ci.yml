name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  privileged-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install filesystem test tools
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs
      - run: cargo build --release
      - name: Reproduce kernel/filesystem conditions
        env:
          NOSPACE_EPHEMERAL_VM: "1"
        run: sudo -E tests/privileged.sh
